<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
     $(document).ready(function () {
        $("button").click(function () {
            $("#div1").fadeIn();
            $("#div2").fadeIn("slow")
            $("#div3").fadeIn(3000)

            $("#div1").fadeOut();
            $("#div2").fadeOut("slow")
            $("#div3").fadeOut(1000)
            
        });

     });
</script>
<body>
    <p>Demonstrate fadeIn() with different parameters.</p>
    <button>click</button>

    <div id="div1" style="width:80px;height:80px;display: none;background-color: rgb(49, 49, 139);"></div>
    <br>
    <div id="div2" style="width:80px;height:80px;display: none;background-color: rgb(175, 162, 40);"></div>
    <br>
    <div id="div3" style="width:80px;height:80px;display: none;background-color: rgb(68, 155, 60);"></div>

    
</body>
</html>
